<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>hvax ingest options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>hvax ingest</h1>
      <p class="lede">
        Every <code>&lt;img&gt;</code> (and optional CSS background) on a page is captured, including
        nodes inserted later. Bytes are POSTed directly to your gallery or to an optional local
        processor. Images without faces come back 204 and are counted as “no face”.
      </p>
      <form id="form">
        <label class="check"><input id="enabled" type="checkbox" /> enabled</label>
        <label>
          remote gallery URL or API base path
          <input id="endpoint" type="url" spellcheck="false" required />
        </label>
        <label>
          local processor URL (optional)
          <input id="processorEndpoint" type="url" spellcheck="false" placeholder="http://127.0.0.1:8080" />
        </label>
        <label>
          API key (sent as <code>X-API-Key</code>, optional)
          <input id="apiKey" type="password" autocomplete="off" />
        </label>
        <div class="row">
          <label>min width <input id="minWidth" type="number" min="1" /></label>
          <label>min height <input id="minHeight" type="number" min="1" /></label>
          <label>max MiB <input id="maxBytesMb" type="number" min="1" /></label>
        </div>
        <label class="check"><input id="captureBackgrounds" type="checkbox" /> capture CSS background-image</label>
        <label class="check"><input id="skipSvg" type="checkbox" /> skip SVG URLs</label>
        <div class="actions">
          <button type="submit">save</button>
          <p id="saved"></p>
        </div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
